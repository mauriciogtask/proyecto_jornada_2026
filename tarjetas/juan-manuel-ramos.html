<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juan Manuel Ramos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;600;800&family=Nunito:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>

    :root{
      --app-bg:#101014;
      --app-panel:#17171d;
      --app-text:#e9e9ee;
      --app-muted:#9a9aa5;
      --app-accent:#7c5cff;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      background:var(--app-bg);
      color:var(--app-text);
      font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .contenedor-ancho{ max-width:1120px; margin-left:auto; margin-right:auto; padding-left:1rem; padding-right:1rem; }

    /* ===== Branding del evento ===== */
    .branding{ border-bottom:1px solid #26262f; }
    .branding .contenedor-ancho{ padding-top:1.6rem; padding-bottom:1.15rem; }
    .brand-eyebrow{
      margin:0 0 .45rem;
      font-family:'Poppins',sans-serif;
      font-weight:800;
      font-size:.72rem;
      letter-spacing:.32em;
      text-transform:uppercase;
      color:var(--app-accent);
    }
    .brand-institucion{
      margin:0 0 .2rem;
      font-family:'Poppins',sans-serif;
      font-weight:600;
      font-size:1.5rem;
      line-height:1.2;
      color:#fff;
    }
    .brand-charla{ margin:0; color:var(--app-muted); font-size:.93rem; }

    /* ===== Header funcional ===== */
    .app-header{ background:var(--app-panel); border-bottom:1px solid #26262f; }
    .app-header .contenedor-ancho{ padding-top:1.4rem; padding-bottom:1.15rem; }
    .app-titulo{
      margin:0 0 .45rem;
      font-family:'Poppins',sans-serif;
      font-weight:800;
      font-size:clamp(1.5rem,3vw,2.15rem);
      line-height:1.15;
      color:#fff;
    }
    .app-sub{ margin:0; color:var(--app-muted); font-size:.93rem; line-height:1.6; max-width:88ch; }
    .app-sub strong{ color:var(--app-text); font-weight:600; }

    main.contenedor-ancho{ padding-top:1.7rem; padding-bottom:1rem; }

    /* ===== Paneles ===== */
    .panel{
      height:100%;
      background:var(--app-panel);
      border:1px solid #26262f;
      border-radius:16px;
      padding:1.35rem;
    }
    .panel-titulo{
      margin:0 0 1rem;
      font-family:'Poppins',sans-serif;
      font-weight:600;
      font-size:1rem;
      color:var(--app-text);
    }

    /* ===== Drop zone ===== */
    .drop-zone{
      border:2px dashed #3a3a45;
      border-radius:12px;
      padding:1.8rem 1.2rem;
      text-align:center;
      cursor:pointer;
      color:var(--app-muted);
      transition:border-color .15s ease, background-color .15s ease, color .15s ease;
    }
    .drop-zone:hover{ border-color:var(--app-accent); }
    .drop-zone.dragover{
      border-color:var(--app-accent);
      background:rgba(124,92,255,.08);
      color:var(--app-text);
    }
    .drop-titulo{ margin:0 0 .35rem; font-weight:500; color:inherit; }
    .drop-sub{ margin:0; font-size:.82rem; line-height:1.5; }

    /* ===== Textarea CSV ===== */
    .csv-textarea{
      width:100%;
      min-height:215px;
      resize:vertical;
      padding:.85rem .9rem;
      background:#0d0d11;
      border:1px solid #2a2a34;
      border-radius:10px;
      color:#cfcfd6;
      font-family:'JetBrains Mono',ui-monospace,monospace;
      font-size:.8rem;
      line-height:1.55;
    }
    .csv-textarea::placeholder{ color:#5f5f6b; }
    .csv-textarea:focus{
      outline:none;
      border-color:var(--app-accent);
      box-shadow:0 0 0 3px rgba(124,92,255,.35);
    }

    /* ===== Botones ===== */
    .btn-accent{
      background:var(--app-accent);
      border:1px solid var(--app-accent);
      color:#fff;
      font-weight:600;
    }
    .btn-accent:hover,
    .btn-accent:focus{
      background:#6a48f0;
      border-color:#6a48f0;
      color:#fff;
    }
    .acciones-botones{ gap:.55rem .6rem; }

    /* ===== QR de la página ===== */
    .panel-qr{
      background:var(--app-panel);
      border:1px solid #26262f;
      border-radius:16px;
      padding:1.25rem 1.35rem;
    }
    #qrPagina{
      display:inline-block;
      padding:.6rem;
      background:#fff;
      border-radius:12px;
      line-height:0;
    }
    #qrPagina img,
    #qrPagina canvas{ display:block; max-width:100%; height:auto; }
    .qr-pagina-url{
      margin:.8rem 0 0;
      font-family:'JetBrains Mono',ui-monospace,monospace;
      font-size:.78rem;
      color:var(--app-muted);
      word-break:break-all;
    }

    /* ===== Notas .zip ===== */
    .zip-note{
      margin:.45rem 0 0;
      color:var(--app-muted);
      font-size:.85rem;
      line-height:1.55;
    }
    .zip-note code{ color:#c9c9d4; background:#0d0d11; border:1px solid #26262f; border-radius:4px; padding:.05rem .3rem; }

    /* ===== Grid de resultados ===== */
    .resultado-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
      gap:1.5rem;
    }
    .empty-state{
      grid-column:1 / -1;
      padding:2.5rem 1.4rem;
      border:2px dashed #3a3a45;
      border-radius:14px;
      text-align:center;
      color:var(--app-muted);
    }
    .empty-state strong{ color:var(--app-text); font-weight:600; }

    /* ===== Tarjeta base ===== */
    .card-presentacion{
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      min-height:290px;
      padding:1.35rem;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(0,0,0,.45);
    }
    .card-contenido{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      padding-top:2.2rem;
    }
    .card-bloque-nombre{ flex:1 1 auto; min-width:0; padding-right:.2rem; }
    .card-eyebrow{
      display:block;
      margin:0 0 .55rem;
      font-family:'Inter',sans-serif;
      font-size:.66rem;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:inherit;
      opacity:.72;
    }
    .card-nombre{
      margin:0;
      font-family:'Poppins',sans-serif;
      font-weight:800;
      font-size:1.9rem;
      line-height:1.08;
      color:inherit;
      overflow-wrap:anywhere;
    }
    .card-siglas{
      flex:0 0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      width:3.5rem;
      height:3.5rem;
      border:1.5px solid currentColor;
      border-radius:50%;
      color:inherit;
      font-family:'Poppins',sans-serif;
      font-weight:800;
      font-size:1.15rem;
      letter-spacing:.02em;
    }
    .card-acciones{
      position:relative;
      z-index:1;
      display:flex;
      flex-wrap:wrap;
      gap:.4rem;
      margin-top:1.05rem;
    }
    .card-agradecimiento{
      margin:.9rem 0 0;
      font-family:'Inter',sans-serif;
      font-size:.78rem;
      line-height:1.5;
      color:inherit;
    }
    .card-agradecimiento-nombre{
      display:block;
      margin-top:.2rem;
      font-weight:600;
    }

    /* ===== Chips ===== */
    .chip{
      display:inline-flex;
      align-items:center;
      gap:.32rem;
      max-width:100%;
      padding:.42rem .78rem;
      border:1px solid currentColor;
      border-radius:999px;
      background:var(--t-chip-bg, transparent);
      color:inherit;
      font-family:'Inter',sans-serif;
      font-size:.76rem;
      font-weight:600;
      line-height:1;
      text-decoration:none;
      vertical-align:middle;
      overflow-wrap:anywhere;
    }
    a.chip{ cursor:pointer; }
    a.chip:hover{ filter:brightness(1.08); text-decoration:none; }
    button.chip{
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
    }
    button.chip:hover{ filter:brightness(1.1); }
    .chip-descargar,
    .chip-imagen{ background:transparent; }

    /* ===== Botón de dado (reroll) ===== */
    .reroll-btn{
      position:absolute;
      top:.85rem;
      right:.85rem;
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      width:2.2rem;
      height:2.2rem;
      padding:0;
      border:1px solid currentColor;
      border-radius:50%;
      background:rgba(255,255,255,.18);
      -webkit-backdrop-filter:blur(4px);
      backdrop-filter:blur(4px);
      color:inherit;
      font-size:.95rem;
      line-height:1;
      cursor:pointer;
      transition:transform .12s ease;
    }
    .reroll-btn:hover{ transform:scale(1.12) rotate(15deg); }

    /* ============================================================
       TEMAS
    ============================================================ */

    /* Menta Ártica */
    .theme-menta{
      --t-chip-bg:rgba(11,61,61,.08);
      background:linear-gradient(135deg,#EAF6F6,#DCEFEA);
      color:#0B3D3D;
    }
    .theme-menta .card-nombre{ font-family:'Poppins',sans-serif; font-weight:800; font-size:2.1rem; }
    .theme-menta .reroll-btn{ background:rgba(11,61,61,.12); }
    .theme-menta .chip-wsp{ background:#FF7B54; border-color:#FF7B54; color:#0B3D3D; }

    /* Violeta Nocturno */
    .theme-violeta{
      --t-chip-bg:rgba(228,221,247,.1);
      background:radial-gradient(circle at top right,#34275a,#241B3A);
      color:#E4DDF7;
    }
    .theme-violeta::after{
      content:"";
      position:absolute;
      top:-22%;
      right:-28%;
      width:85%;
      height:85%;
      z-index:0;
      background:linear-gradient(135deg, rgba(242,177,56,0) 38%, rgba(242,177,56,.22) 55%, rgba(242,177,56,0) 72%);
      pointer-events:none;
    }
    .theme-violeta .card-nombre{ font-family:'Fraunces',serif; font-weight:600; font-size:2.3rem; }
    .theme-violeta .card-eyebrow{ color:#F2B138; opacity:1; }
    .theme-violeta .chip-wsp{ background:transparent; border-color:#F2B138; color:#F2B138; }

    /* Papel Kraft */
    .theme-kraft{
      --t-chip-bg:rgba(27,42,65,.08);
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.11) 0 1px, rgba(255,255,255,0) 1px 14px),
        #C9A876;
      border:2px solid #a9865a;
      color:#1B2A41;
    }
    .theme-kraft .card-eyebrow{
      display:inline-block;
      padding:.22rem .5rem;
      border:1px dashed currentColor;
      border-radius:4px;
      letter-spacing:.14em;
      opacity:1;
    }
    .theme-kraft .card-nombre{ font-family:'Fraunces',serif; font-weight:800; font-size:2.1rem; }
    .theme-kraft .chip-wsp{ background:#E4A11B; border-color:#E4A11B; color:#1B2A41; }

    /* Arcade Neón */
    .theme-arcade{
      --t-chip-bg:rgba(0,240,255,.08);
      background:#12122B;
      color:#fff;
    }
    .theme-arcade::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(0,240,255,.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,.1) 1px, transparent 1px);
      background-size:26px 26px;
    }
    .theme-arcade .card-eyebrow{
      font-family:'Press Start 2P',monospace;
      font-size:.55rem;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:#00F0FF;
      opacity:1;
    }
    .theme-arcade .card-nombre{
      font-family:'Poppins',sans-serif;
      font-weight:800;
      font-size:2rem;
      color:#fff;
      text-shadow:0 0 14px rgba(0,240,255,.5), 0 0 2px rgba(0,240,255,.8);
    }
    .theme-arcade .chip-wsp{ background:#FF2E93; border-color:#FF2E93; color:#fff; }

    /* Botánico */
    .theme-botanico{
      --t-chip-bg:rgba(47,70,48,.07);
      background:linear-gradient(180deg,#EEF3E8,#DCE8D2);
      color:#2F4630;
      border-radius:8px 32px 8px 32px;
    }
    .theme-botanico .card-eyebrow{ color:#7A9161; opacity:1; }
    .theme-botanico .card-nombre{ font-family:'Fraunces',serif; font-weight:600; font-size:2.2rem; }
    .theme-botanico .chip-wsp{ background:#C98A3B; border-color:#C98A3B; color:#fff; }

    /* Concreto Industrial */
    .theme-concreto{
      --t-chip-bg:rgba(34,37,42,.07);
      background:#D9D9D6;
      color:#22252A;
      border-radius:6px;
    }
    .theme-concreto::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:repeating-linear-gradient(0deg, rgba(34,37,42,.1) 0 1px, rgba(34,37,42,0) 1px 26px);
    }
    .theme-concreto .card-eyebrow{ color:#2D6CDF; opacity:1; }
    .theme-concreto .card-nombre{ font-family:'Nunito',sans-serif; font-weight:900; font-size:2.1rem; }
    .theme-concreto .chip{ border-radius:4px; }
    .theme-concreto .chip-wsp{ background:#2D6CDF; border-color:#2D6CDF; color:#fff; }

    /* ===== Footer ===== */
    .app-footer{ margin-top:3rem; border-top:1px solid #26262f; }
    .app-footer .contenedor-ancho{
      padding-top:1.1rem;
      padding-bottom:1.6rem;
      text-align:center;
      color:var(--app-muted);
      font-size:.83rem;
    }
  
body.export-cuerpo{background:#101014;color:#e9e9ee;font-family:"Inter",system-ui,sans-serif;margin:0;padding:1rem;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.export-contenedor{width:100%;max-width:400px;margin:0 auto;}
.export-contenedor .card-presentacion{width:100%;}
.reroll-btn{display:none !important;}
.chip-descargar{display:none !important;}
.chip-imagen{display:none !important;}
  </style>
</head>
<body class="export-cuerpo">
  <div class="export-contenedor">
    <article class="card-presentacion theme-botanico"><button type="button" class="reroll-btn" title="Cambiar estilo" aria-label="Cambiar estilo">🎲</button><div class="card-contenido"><div class="card-bloque-nombre"><span class="card-eyebrow">Tarjeta de contacto</span><div class="card-nombre">Juan Manuel Ramos</div></div><div class="card-siglas" aria-hidden="true">JM</div></div><div class="card-acciones"><a class="chip chip-mail" href="mailto:juanmanuelramos1589@gmail.com" title="juanmanuelramos1589@gmail.com">✉️ Mail</a><a class="chip chip-wsp" href="https://wa.me/3513139953" target="_blank" rel="noopener" title="Escribir por WhatsApp">💬 WhatsApp</a><a class="chip chip-linkedin" href="https://www.linkedin.com/in/juan-manuel-ramos" target="_blank" rel="noopener" title="https://www.linkedin.com/in/juan-manuel-ramos">🔗 LinkedIn</a><a class="chip chip-instagram" href="https://instagram.com/jmramos1589" target="_blank" rel="noopener" title="https://instagram.com/jmramos1589">📷 Instagram</a><button type="button" class="chip chip-descargar">⬇️ Descargar</button><button type="button" class="chip chip-imagen">🖼️ Imagen</button></div></article>
  </div>
</body>
</html>
